services:
  mysql:
    image: mysql:8.0
    container_name: monsterhouse-mysql
    restart: unless-stopped
    ports:
      # 호스트 3306 은 다른 프로젝트가 점유하는 경우가 잦아 기본값을 3307 로 둡니다.
      # 컨테이너 안쪽은 그대로 3306 입니다.
      - "${DB_PORT:-3307}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root1234}
      MYSQL_DATABASE: ${DB_NAME:-monsterhouse}
      MYSQL_USER: ${DB_USERNAME:-monster}
      MYSQL_PASSWORD: ${DB_PASSWORD:-monster1234}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      # 예약 동시성 검증용 — 락 대기 타임아웃을 짧게 두어 데드락을 빨리 드러냄
      - --innodb-lock-wait-timeout=10
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-root1234}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
