name: CI

# main 에 push 하거나 main 으로 PR 을 올릴 때 돕니다.
# 다른 브랜치에서 작업 중일 때는 PR 을 올리기 전까지 돌지 않습니다.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Actions 화면에서 "Run workflow" 로 수동 배포도 가능하게.
  workflow_dispatch:

# 같은 브랜치에 연달아 push 하면 앞선 실행을 취소합니다.
# 어차피 최신 커밋 결과만 의미가 있고, 러너 시간도 아낍니다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 빌드 · 테스트
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Java 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle 의존성·빌드 캐시를 자동으로 저장/복원합니다.
      # 없으면 매번 의존성을 새로 받아 3~4분이 더 걸립니다.
      - name: Gradle 준비
        uses: gradle/actions/setup-gradle@v4

      # 윈도우에서 커밋된 gradlew 는 실행 권한이 없을 수 있습니다.
      - run: chmod +x ./gradlew

      # ★ 테스트가 Testcontainers 로 진짜 MySQL 8 을 띄웁니다.
      #   H2 로는 SELECT ... FOR UPDATE 의 잠금 범위, INSERT IGNORE,
      #   유니크 인덱스의 NULL 처리가 전부 달라 예약 동시성 검증이 무의미해집니다.
      #   ubuntu 러너에는 Docker 가 이미 설치되어 있어 추가 설정이 필요 없습니다.
      #
      #   build.gradle 의 DOCKER_HOST(npipe) 설정은 윈도우에서만 적용되도록
      #   OS 로 가드되어 있어 여기서는 건드리지 않습니다.
      - name: 빌드 + 테스트
        run: ./gradlew build --no-daemon

      # 실패했을 때만 HTML 리포트를 올립니다.
      # 로그만으로는 어느 단언에서 깨졌는지 보기 어렵습니다.
      - name: 테스트 리포트 (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  docker:
    name: 이미지 빌드
    runs-on: ubuntu-latest
    # 테스트가 깨진 코드로 이미지를 만들 이유가 없습니다.
    needs: build

    steps:
      - uses: actions/checkout@v4

      # 이미지를 푸시하지는 않습니다. Dockerfile 이 깨지지 않았는지만 확인합니다.
      # (레지스트리에 올리려면 여기에 로그인 + push 단계를 추가하세요)
      #
      # ⚠ 이 단계는 "빌드가 되는가"만 봅니다. 컨테이너를 띄웠을 때의 문제
      #   (nginx 설정 오류, runAsNonRoot 검증 실패 등)는 잡지 못합니다.
      #   그건 실제로 배포해봐야 나옵니다.
      - name: Dockerfile 검증
        run: docker build -t monsterhouse/backend:ci .

  deploy:
    name: 서버 배포
    runs-on: ubuntu-latest
    # 빌드·테스트·이미지가 모두 통과해야 배포합니다.
    needs: [build, docker]
    # main 에 push 되고, 저장소 변수 DEPLOY=true 일 때만 실제 배포합니다.
    # (변수를 켜기 전까지 이 잡은 건너뜁니다 — 시크릿 준비 전 빨간 실패 방지)
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      vars.DEPLOY == 'true'
    # 같은 저장소에서 배포가 겹치지 않게(서버 쪽 flock 이 저장소 간 겹침까지 막습니다).
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      # SSH 로 서버에 접속해 deploy.sh 실행(git pull + 재빌드 + 무중단 교체).
      - name: SSH 배포
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            cd /opt/monsterhouse/BE/deploy
            bash deploy.sh
