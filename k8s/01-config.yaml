# 비밀이 아닌 설정값. 비밀은 02-secret.yaml 로 분리합니다.
#
# ⚠ 여기에 비밀번호·토큰을 넣지 마세요.
#   ConfigMap 은 `kubectl get cm -o yaml` 로 누구나 평문으로 읽습니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: monsterhouse-config
  namespace: monsterhouse
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SERVER_PORT: "8080"
  TZ: "Asia/Seoul"

  # ----- DB -----
  # mysql 은 같은 네임스페이스의 Service 이름입니다 (10-mysql.yaml).
  DB_HOST: "mysql"
  DB_PORT: "3306"
  DB_NAME: "monsterhouse"
  DB_USERNAME: "monster"

  # ----- 사이트 -----
  # ↓↓↓ 실제 도메인으로 바꾸세요. sitemap·메일 링크에 그대로 들어갑니다.
  SITE_BASE_URL: "https://monsterhouse.example.com"
  CORS_ALLOWED_ORIGINS: "https://monsterhouse.example.com"

  # ----- 인증 -----
  JWT_ACCESS_EXP_MINUTES: "30"
  JWT_REFRESH_EXP_DAYS: "14"
  # HTTPS 로 서비스하므로 true. HTTP 로 테스트할 때만 false 로 내리세요.
  # true 인데 HTTP 로 접속하면 브라우저가 쿠키를 저장하지 않아
  # "로그인은 되는데 새로고침하면 풀리는" 증상이 납니다.
  JWT_COOKIE_SECURE: "true"
  JWT_COOKIE_SAME_SITE: "Lax"

  # ----- 저장소 -----
  # local = 파드 볼륨(PVC). s3 = AWS S3 + CloudFront.
  #
  # ★ local 이면 백엔드 replicas 를 1 로 유지해야 합니다.
  #   PVC 가 ReadWriteOnce 라 파드 2개가 같은 디스크를 공유하지 못하고,
  #   업로드한 이미지가 올린 파드에서만 보입니다.
  #   스케일아웃하려면 s3 로 바꾸세요 (20-backend.yaml 주석 참고).
  STORAGE_TYPE: "local"
  STORAGE_LOCAL_PATH: "/app/uploads"
  AWS_REGION: "ap-northeast-2"
  AWS_S3_BUCKET: "monsterhouse-media"
  CLOUDFRONT_DOMAIN: ""

  # ----- 알림 -----
  # 자격증명을 넣기 전까지는 false 로 두세요.
  # true 인데 값이 비어 있으면 예약마다 발송 실패 로그만 쌓입니다.
  MAIL_ENABLED: "false"
  MAIL_HOST: "smtp.gmail.com"
  MAIL_PORT: "587"
  MAIL_FROM: "noreply@monsterhouse.example.com"
  MAIL_ADMIN_TO: "owner@monsterhouse.example.com"
  LINE_ENABLED: "false"

  # ----- 유튜브 -----
  YOUTUBE_CHANNEL_ID: ""
