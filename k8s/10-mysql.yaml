# 클러스터 내부 MySQL.
#
# 언제 이걸 쓰고, 언제 관리형 DB(RDS)로 옮겨야 하나:
#   · 단일 노드 k3s 에서는 이 방식이 비용 0 이고 충분합니다.
#   · 다만 노드가 죽으면 DB 도 같이 죽습니다. 예약 데이터가 들어 있으므로
#     백업(mysqldump → 외부 저장소)은 반드시 별도로 걸어두세요.
#     PVC 는 백업이 아닙니다 — 노드 디스크가 날아가면 같이 날아갑니다.
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: monsterhouse
spec:
  # StatefulSet 의 안정적 네트워크 ID 를 위한 헤드리스 서비스입니다.
  # 백엔드는 DB_HOST=mysql 로 접근합니다.
  clusterIP: None
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
      name: mysql
---
# 초기화 SQL — DB 레벨 설정만 합니다. 테이블은 만들지 않습니다.
#
# ⚠ 여기서 테이블을 만들면 안 됩니다.
#   prod 프로파일은 Flyway 가 켜져 있어 V1/V2 가 스키마를 만드는데,
#   같은 테이블이 이미 있으면 마이그레이션이 실패합니다.
#   (V2__shedlock.sql 은 CREATE TABLE 이지 CREATE TABLE IF NOT EXISTS 가 아닙니다)
#
#   더 나쁜 건 그다음입니다. Flyway 가 flyway_schema_history 에 "실패"를 기록해서
#   파드를 재시작해도 계속 아래 오류로 죽습니다:
#     Detected failed migration to version 2 (shedlock).
#   실제로 이 클러스터에서 그렇게 막혔고, DB 를 지워야 복구됐습니다.
#
#   로컬(docker-compose)은 Flyway 가 꺼져 있고 shedlock 이 JPA 엔티티도 아니라
#   아무도 안 만들어주기 때문에 BE/docker/mysql/init 에는 그대로 둡니다.
#   그쪽과 이 파일의 역할이 다릅니다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-init
  namespace: monsterhouse
data:
  01-init.sql: |
    ALTER DATABASE monsterhouse
        CHARACTER SET utf8mb4
        COLLATE utf8mb4_unicode_ci;
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: monsterhouse
spec:
  serviceName: mysql
  # ★ 반드시 1 입니다. MySQL 은 복제 설정 없이 여러 개 띄우면
  #   각자 다른 데이터를 가진 별개의 DB 가 됩니다.
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --default-time-zone=+09:00
            # 예약 동시성 방어에서 락 대기가 길어지면 요청이 쌓입니다.
            # 짧게 끊어 429 로 안내하는 편이 낫습니다.
            - --innodb-lock-wait-timeout=10
          env:
            - name: TZ
              value: Asia/Seoul
            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: monsterhouse-config
                  key: DB_NAME
            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: monsterhouse-config
                  key: DB_USERNAME
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monsterhouse-secret
                  key: DB_PASSWORD
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: monsterhouse-secret
                  key: MYSQL_ROOT_PASSWORD
          ports:
            - containerPort: 3306
              name: mysql
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: init
              mountPath: /docker-entrypoint-initdb.d
          # MySQL 첫 기동은 데이터 디렉터리 초기화 때문에 오래 걸립니다.
          # startupProbe 로 넉넉히 기다린 뒤 readiness 로 넘깁니다.
          # 이게 없으면 초기화 중에 liveness 가 실패해 무한 재시작에 빠집니다.
          startupProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
      volumes:
        - name: init
          configMap:
            name: mysql-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # k3s 기본 스토리지클래스는 local-path 입니다.
        # 지정하지 않으면 기본값이 쓰이므로 대부분 이대로 동작합니다.
        resources:
          requests:
            storage: 10Gi
