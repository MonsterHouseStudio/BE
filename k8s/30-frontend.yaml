---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: monsterhouse
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      name: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: monsterhouse
spec:
  # 정적 파일만 서빙하므로 상태가 없습니다. 마음껏 늘려도 됩니다.
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # ↓↓↓ 빌드한 이미지로 바꾸세요.
          #
          # ⚠ FE 는 VITE_* 를 빌드 시점에 번들에 박습니다.
          #   따라서 API 주소나 목 모드를 바꾸려면 재배포가 아니라
          #   "재빌드"가 필요합니다. ConfigMap 을 고쳐도 반영되지 않습니다.
          image: monsterhouse/frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          readinessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 80
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
