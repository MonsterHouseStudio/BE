# ⚠ 이 파일을 02-secret.yaml 로 복사해서 값을 채우세요.
#   02-secret.yaml 은 .gitignore 에 등록되어 있습니다. 절대 커밋하지 마세요.
#
#   cp k8s/02-secret.example.yaml k8s/02-secret.yaml
#
# stringData 를 쓰면 base64 로 직접 인코딩할 필요가 없습니다.
# (data 를 쓰면 base64 여야 하는데, 손으로 인코딩하다 개행이 섞여
#  "값은 맞는데 인증이 안 되는" 문제를 자주 만듭니다)
apiVersion: v1
kind: Secret
metadata:
  name: monsterhouse-secret
  namespace: monsterhouse
type: Opaque
stringData:
  # ----- DB -----
  DB_PASSWORD: "CHANGE_ME"
  # MySQL StatefulSet 초기화에 쓰입니다 (10-mysql.yaml).
  MYSQL_ROOT_PASSWORD: "CHANGE_ME"

  # ----- JWT -----
  # ★ 최소 32자 이상의 무작위 문자열이어야 합니다. HS256 서명 키입니다.
  #   생성: openssl rand -base64 48
  #   이 값이 유출되면 누구나 관리자 토큰을 위조할 수 있습니다.
  JWT_SECRET: "CHANGE_ME_MIN_32_CHARS_RANDOM_STRING"

  # ----- 메일 (MAIL_ENABLED=true 일 때만 필요) -----
  MAIL_USERNAME: ""
  MAIL_PASSWORD: ""

  # ----- LINE (LINE_ENABLED=true 일 때만 필요) -----
  LINE_CHANNEL_ACCESS_TOKEN: ""
  LINE_ADMIN_USER_ID: ""

  # ----- 유튜브 -----
  YOUTUBE_API_KEY: ""
