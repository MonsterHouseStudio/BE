# Let's Encrypt 인증서 자동 발급 설정.
#
# ⚠ 이 파일만으로는 동작하지 않습니다.
#   cert-manager 자체를 먼저 설치해야 합니다 (bootstrap-server.sh 가 해줍니다).
#   설치 전에 이 파일을 적용하면 "no matches for kind ClusterIssuer" 로 실패합니다.
#
# ★ staging 을 먼저 쓰는 이유
#   Let's Encrypt 운영 서버는 실패 횟수에 강한 제한이 있습니다
#   (같은 도메인에 대해 1시간당 5회 실패하면 그 뒤로는 몇 시간 막힙니다).
#   DNS 가 아직 안 붙었거나 80 포트가 막혀 있으면 발급이 실패하는데,
#   그걸 운영 서버로 시험하면 정작 준비가 끝난 뒤에 발급을 못 받습니다.
#   staging 으로 먼저 성공을 확인하고 prod 로 바꾸세요.
#   (staging 인증서는 브라우저가 신뢰하지 않아 경고가 뜹니다 — 정상입니다)
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    # ↓↓↓ ★ 반드시 실제 이메일로 바꾸세요.
    #   example.com 을 그대로 두면 Let's Encrypt 가 거부합니다:
    #     Failed to register ACME account: 400 invalidContact:
    #     contact email has forbidden domain "example.com"
    #   이러면 ClusterIssuer 가 영영 Ready 가 되지 않고 인증서도 발급되지 않는데,
    #   Ingress 는 멀쩡해 보여서 원인을 찾기 어렵습니다.
    #   확인: kubectl describe clusterissuer letsencrypt-staging
    email: CHANGE_ME@example.com
    privateKeySecretRef:
      name: letsencrypt-staging-account
    solvers:
      - http01:
          ingress:
            class: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    # ↓↓↓ ★ 반드시 실제 이메일로 바꾸세요 (위 staging 주석 참고).
    email: CHANGE_ME@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account
    solvers:
      # HTTP-01 챌린지 — Let's Encrypt 가 http://도메인/.well-known/acme-challenge/... 로
      # 접속해 소유권을 확인합니다.
      #
      # 그래서 발급 전에 반드시 아래 두 가지가 되어 있어야 합니다:
      #   1. 도메인 A 레코드가 이 서버 공인 IP 를 가리킬 것
      #   2. 보안그룹에서 80 포트가 열려 있을 것 (443 만 열면 발급이 안 됩니다)
      - http01:
          ingress:
            class: traefik
