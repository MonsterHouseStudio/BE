# MONSTER HOUSE 운영 배포 (가비아 g클라우드 · VPS 1대)
#
# 전제 디렉터리 구조 (BE·FE 를 형제로 clone):
#   /opt/monsterhouse/
#   ├── BE/                 (이 저장소)
#   │   └── deploy/         ← 여기서 실행: docker compose -f docker-compose.prod.yml ...
#   └── FE/                 (MonsterHouseStudio/FE)
#
# application-prod.yml 은 gitignore 라 이미지에 없습니다.
# 그래서 운영 설정을 전부 "환경변수"로 넘깁니다(컨테이너 표준 방식).
# 비밀값은 옆의 .env 파일에서 읽습니다(.env.example 참고).

name: monsterhouse

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD 를 .env 에 설정하세요}
      MYSQL_DATABASE: ${DB_NAME:-monsterhouse}
      MYSQL_USER: ${DB_USERNAME:-monster}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 를 .env 에 설정하세요}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      # 4GB 서버에서 버퍼풀을 적당히. 데이터가 커지면 이 값을 올리세요.
      - --innodb-buffer-pool-size=512M
    mem_limit: 1g          # MySQL 이 쓸 수 있는 메모리 상한
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # ⚠ 포트를 밖으로 열지 않습니다. 내부 네트워크로만 backend 가 접근합니다.
    #    외부에서 DB 직결을 막는 것이 기본 방어입니다.

  backend:
    build:
      context: ..          # BE 저장소 루트 (Dockerfile 위치)
    restart: unless-stopped
    # ⚠ JVM 은 기본적으로 "호스트" 메모리의 75% 를 잡으려 합니다(Dockerfile 의 MaxRAMPercentage).
    #    제한이 없으면 4GB 서버에서 JVM 이 3GB 를 먹어 MySQL 이 굶습니다.
    #    이 상한(1.5GB) 안에서 힙이 ~1.1GB 로 잡혀 MySQL·OS 와 나눠 씁니다.
    mem_limit: 1536m
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # --- DB (application-prod.yml 대신 env 로 주입) ---
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${DB_NAME:-monsterhouse}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-monster}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate    # 운영은 스키마 자동변경 금지. Flyway 만.
      # --- 보안 ---
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET(32자 이상) 를 .env 에 설정하세요}
      JWT_COOKIE_SECURE: "true"
      APP_JWT_COOKIE_SAME_SITE: Strict
      CORS_ALLOWED_ORIGINS: ${SITE_ORIGIN:?SITE_ORIGIN(https://도메인) 를 .env 에 설정하세요}
      SITE_BASE_URL: ${SITE_ORIGIN}
      # --- 이미지 저장 (VPS 디스크. 볼륨으로 보존) ---
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/uploads
      # --- 알림 (선택) ---
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      MAIL_ADMIN_TO: ${MAIL_ADMIN_TO:-}
      LINE_ENABLED: ${LINE_ENABLED:-false}
      LINE_CHANNEL_TOKEN: ${LINE_CHANNEL_TOKEN:-}
      LINE_ADMIN_USER_ID: ${LINE_ADMIN_USER_ID:-}
      # --- 첫 관리자 계정 (최초 1회만 true, 로그인 후 .env 에서 다시 false) ---
      APP_ADMIN_SEED_ENABLED: ${ADMIN_SEED_ENABLED:-false}
      APP_ADMIN_SEED_USERNAME: ${ADMIN_SEED_USERNAME:-}
      APP_ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
    volumes:
      - uploads:/app/uploads
    # 포트를 밖으로 열지 않습니다. Caddy 만 내부에서 8080 으로 접근합니다.

  frontend:
    build:
      context: ../../FE      # FE 저장소 (BE 와 형제 위치)
      args:
        VITE_USE_MOCK: "false"
        VITE_API_BASE_URL: /api
        VITE_YOUTUBE_CHANNEL_URL: ${VITE_YOUTUBE_CHANNEL_URL:-}
        VITE_LINE_ADD_FRIEND_URL: ${VITE_LINE_ADD_FRIEND_URL:-}
    restart: unless-stopped
    # nginx 가 /api·/uploads 를 404 로 막으므로(FE/nginx.conf) 그 둘은 Caddy 가 backend 로 보냅니다.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?SITE_DOMAIN(도메인, 스킴 없이) 를 .env 에 설정하세요}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL(인증서용 실제 이메일) 를 .env 에 설정하세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # 발급받은 인증서 보존 (재시작해도 재발급 안 함)
      - caddy-config:/config

volumes:
  mysql-data:
  uploads:
  caddy-data:
  caddy-config:
