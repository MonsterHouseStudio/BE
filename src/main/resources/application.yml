spring:
  application:
    name: monsterhouse
  profiles:
    default: local



  flyway:
    enabled: true
    locations: classpath:db/migration

    # ★ baseline-on-migrate 는 "스키마가 비어있지 않은데 이력 테이블이 없을 때"만 동작합니다.
    #
    #   빈 DB(운영 첫 배포)      → baseline 안 함. V1 부터 전부 적용 ✔
    #   테이블이 이미 있는 DB     → baseline-version 으로 이력을 찍고 그 이후 버전만 적용
    #
    #   그래서 baseline-version 은 반드시 1 이어야 합니다.
    #   0 으로 두면 "V1 은 아직 적용 안 됨"으로 판단해 CREATE TABLE 을 시도하고,
    #   이미 있는 테이블에 부딪혀 기동이 실패합니다.
    baseline-on-migrate: true
    baseline-version: 1

    # 운영에서 절대 켜지 마세요. 스키마를 전부 지우고 다시 만듭니다.
    clean-disabled: true

    # 이미 적용된 마이그레이션 파일을 나중에 수정하면 체크섬이 어긋나 기동이 실패합니다.
    # 그게 정상 동작입니다 — 끄지 마세요.
    validate-on-migrate: true

  # ⚠ 가상 스레드(Java 21)를 일부러 켜지 않았습니다.
  #
  #   threads.virtual.enabled: true 로 두면 톰캣 요청 처리가 가상 스레드로 바뀝니다.
  #   그런데 Java 21 에서는 synchronized 블록 안에서 블로킹하면
  #   캐리어 스레드가 고정(pinning)됩니다. JDBC 드라이버와 HikariCP 내부에
  #   synchronized 구간이 있어서, 예약처럼 DB 락을 오래 잡는 요청이 많으면
  #   오히려 캐리어 풀이 말라 처리량이 떨어질 수 있습니다.
  #   (JDK 24 의 JEP 491 에서 해소되었습니다)
  #
  #   촬영 예약은 하루 수 건 규모라 가상 스레드로 얻을 이득이 사실상 없습니다.
  #   측정 없이 켜는 건 위험만 늘리는 선택이라 두고 봅니다.
  # threads:
  #   virtual:
  #     enabled: true

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          time_zone: Asia/Seoul
          batch_size: 50
        order_inserts: true
        order_updates: true

  # --- i18n: 서버가 만드는 문자열 (검증 에러 · 메일 본문) ---
  messages:
    basename: messages/messages
    encoding: UTF-8
    fallback-to-system-locale: false
    always-use-message-format: false

  servlet:
    multipart:
      # app.storage 의 상한(이미지 20MB / 영상 20MB)보다 일부러 크게 잡습니다.
      # 여기서 먼저 걸리면 서블릿이 본문을 끊어버려 서비스의 친절한 메시지
      # ("20MB 이하로 올려주세요")까지 도달하지 못하고, MaxUploadSizeExceededException
      # 만 남습니다. 정상 범위는 서비스가 걸러내고, 비정상 크기만 여기서 막습니다.
      max-file-size: 30MB
      max-request-size: 100MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
    deserialization:
      fail-on-unknown-properties: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
      mail.mime.charset: UTF-8

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      # 쿠버네티스 프로브용으로 health 를 둘로 쪼갭니다.
      #   /actuator/health/liveness  — 죽었는가? (실패하면 파드 재시작)
      #   /actuator/health/readiness — 트래픽 받을 준비가 됐는가? (실패하면 LB 에서 제외)
      # 이걸 나누지 않고 /actuator/health 하나만 쓰면, DB 가 잠깐 끊겼을 때
      # "트래픽만 잠시 빼면 될 상황"에 파드가 통째로 재시작됩니다.
      probes:
        enabled: true
  health:
    # 메일은 실패해도 예약·문의를 막지 않는 비동기 부가 채널입니다(§5.3).
    # 그런데 기본 헬스 인디케이터는 SMTP 접속을 시도하고, 실패하면 앱 전체를 DOWN 으로
    # 만들어 로드밸런서가 인스턴스를 빼거나 오케스트레이터가 재시작시킵니다.
    # 서비스 가용성과 무관하므로 헬스 판정에서 제외합니다.
    mail:
      enabled: false

# ============================================
#  애플리케이션 커스텀 설정
# ============================================
app:
  # sitemap.xml / hreflang 에 쓰이는 사이트 절대 주소 (기획서 §2.1, §10 Phase5)
  # 검색엔진에 내려보내는 값이라 반드시 실제 도메인이어야 합니다.
  site:
    base-url: ${SITE_BASE_URL:http://localhost:5173}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  # --- 예약 정책 (§12 클라이언트 확정 후 조정) ---
  booking:
    # 슬롯 시작 시각 그리드 (분). 90분 상품이어도 30분 간격으로 시작 시각 노출
    slot-step-min: 30
    # 촬영 종료 후 정리/이동 버퍼 (분)
    buffer-min: 15
    # 오늘로부터 몇 일 뒤까지 예약 가능한가
    max-advance-days: 90
    # 최소 몇 시간 전까지 신청 가능한가
    min-lead-hours: 24
    # true = 촬영팀이 1팀. 상품이 달라도 같은 시간대 동시 예약 불가.
    shared-resource: true
    # true = 신청 즉시 CONFIRMED, false = 관리자 승인 후 CONFIRMED
    auto-confirm: false

  jwt:
    secret: ${JWT_SECRET}
    access-exp-minutes: ${JWT_ACCESS_EXP_MINUTES:30}
    refresh-exp-days: ${JWT_REFRESH_EXP_DAYS:14}
    issuer: monsterhouse
    # 리프레시 토큰은 JS 가 읽을 수 없도록 httpOnly 쿠키로만 오갑니다.
    # (액세스 토큰은 Authorization 헤더 → XSS 로 리프레시까지 털리는 걸 막는 구조)
    refresh-cookie-name: mh_refresh
    cookie-secure: ${JWT_COOKIE_SECURE:false}
    cookie-same-site: ${JWT_COOKIE_SAME_SITE:Lax}

  admin:
    # 로그인 시도 제한 (기획서 §9)
    max-login-attempts: 5
    lock-minutes: 15

  # 공개 폼(예약·문의) 스팸 방지 (기획서 §9)
  # 캡차는 전환율을 떨어뜨리므로 2차로 미루고, 우선 IP 기준 횟수 제한 + honeypot 으로 막습니다.
  rate-limit:
    enabled: true
    # window-seconds 동안 같은 IP 가 보낼 수 있는 횟수
    capacity: 5
    window-seconds: 60

  mail:
    from: ${MAIL_FROM:noreply@monsterhouse.example}
    admin-to: ${MAIL_ADMIN_TO:admin@monsterhouse.example}
    enabled: ${MAIL_ENABLED:false}

  # --- LINE Messaging API (LINE Notify 아님. 2025-03-31 종료됨) ---
  line:
    enabled: ${LINE_ENABLED:false}
    channel-access-token: ${LINE_CHANNEL_ACCESS_TOKEN:}
    admin-user-id: ${LINE_ADMIN_USER_ID:}
    push-url: https://api.line.me/v2/bot/message/push
    connect-timeout-ms: 3000
    read-timeout-ms: 5000
    max-retry: 3

  storage:
    # local = 서버 디스크에 저장 (개발용). s3 = AWS S3 + CloudFront (운영)
    # AWS 자격증명 없이도 개발할 수 있도록 구현을 둘로 나눠뒀습니다.
    type: ${STORAGE_TYPE:local}
    local-path: ${STORAGE_LOCAL_PATH:./uploads}
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:monsterhouse-media}
    cdn-domain: ${CLOUDFRONT_DOMAIN:}
    presign-expire-minutes: 10
    # 업로드 허용 한도 (기획서 §9 파일 업로드 검증)
    max-image-bytes: 20971520      # 20MB
    # 리사이즈 산출물 크기 (기획서 §6.2 — 썸네일/중간/원본 3종)
    medium-width: 1600
    thumb-width: 480
    # 배너 배경 영상 상한. 서버에서 인코딩하지 않으므로 그대로 저장됩니다.
    # 20MB 를 넘기면 모바일 사용자가 첫 화면 하나에 데이터를 많이 씁니다.
    max-video-bytes: 20971520      # 20MB

  youtube:
    api-key: ${YOUTUBE_API_KEY:}
    channel-id: ${YOUTUBE_CHANNEL_ID:}
    cache-ttl-minutes: 60
    max-results: 3

  notification:
    retry:
      # 발송 실패한 알림을 재시도합니다 (지수 백오프 1→2→4→8분, 5회 후 포기).
      enabled: ${NOTIFICATION_RETRY_ENABLED:true}
      # 배치 간격. 너무 짧으면 죽어 있는 외부 API 를 계속 때리고,
      # 너무 길면 사장님이 예약 알림을 늦게 받습니다.
      interval-ms: ${NOTIFICATION_RETRY_INTERVAL_MS:60000}

  # 개인정보 보유기간 (기획서 §9). 지나면 자동 파기합니다.
  retention:
    enabled: true
    # 촬영 예약: 촬영 완료일로부터 1년
    booking-days: 365
    # 문의 내역: 처리 완료일로부터 6개월
    inquiry-days: 180
    # 매일 새벽 4시 (트래픽이 가장 적은 시간)
    cron: "0 0 4 * * *"
