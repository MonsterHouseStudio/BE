# ===== 共通 =====
error.internal=サーバーエラーが発生しました。
error.invalid.input=入力内容に誤りがあります。
error.not.found=お探しのページ・データが見つかりません。
error.unauthorized=ログインが必要です。
error.forbidden=アクセス権限がありません。
error.too.many.requests=リクエストが多すぎます。しばらくしてから再度お試しください。

# ===== 予約 =====
error.booking.slot.taken=この時間はすでに予約されています。別の時間をお選びください。
error.booking.slot.unavailable=選択された時間は予約できません。
error.booking.closed.day=この日は休業日です。
error.booking.out.of.range=予約可能な期間外の日付です。
error.booking.too.late=予約は{0}時間前までにお申し込みください。
error.booking.not.found=予約情報が見つかりません。
error.booking.invalid.status=現在の状態では変更できません。
error.booking.already.canceled=すでにキャンセルされた予約です。
error.product.not.found=撮影プランが見つかりません。
error.product.inactive=現在ご予約を受け付けていないプランです。
error.product.in.use=予約履歴のあるプランは削除できません。代わりに非公開にしてください。

# ===== コンテンツ =====
error.post.not.found=記事が見つかりません。
error.translation.missing=この言語のコンテンツはまだありません。

# ===== お問い合わせ =====
error.inquiry.not.found=お問い合わせ内容が見つかりません。

# ===== 管理者 =====
error.auth.invalid.credentials=IDまたはパスワードが正しくありません。
error.auth.token.expired=ログインの有効期限が切れました。再度ログインしてください。
error.auth.token.invalid=認証情報が正しくありません。
error.auth.account.locked=ログイン試行回数を超えました。{0}分後に再度お試しください。
error.auth.refresh.invalid=セッションの有効期限が切れました。再度ログインしてください。

# ===== メール =====
mail.booking.requested.subject=[MONSTER HOUSE] 撮影予約のお申し込みを受け付けました
mail.booking.confirmed.subject=[MONSTER HOUSE] 撮影予約が確定しました
mail.booking.canceled.subject=[MONSTER HOUSE] 撮影予約がキャンセルされました
mail.booking.greeting={0}様
mail.booking.info.product=撮影プラン: {0}
mail.booking.info.datetime=ご予約日時: {0}
mail.booking.info.code=予約番号: {0}
mail.booking.requested.body=お申し込みを受け付けました。確認のうえ、確定のご連絡をいたします。
mail.booking.confirmed.body=ご予約が確定しました。お時間にあわせてお越しください。
mail.booking.canceled.body=ご予約はキャンセルされました。
mail.footer=MONSTER HOUSE

# ===== LINE 管理者通知 =====
line.inquiry.interpreter=[通訳申込] {0} / {1}\n{2}
line.inquiry.video=[映像お問合せ] {0} / {1}\n{2}
line.booking.requested=[予約申込] {0}\n{1} / {2}\n{3}

# ===== Bean Validation =====
valid.name.required=お名前をご入力ください。
valid.phone.required=ご連絡先をご入力ください。
valid.phone.pattern=ご連絡先の形式が正しくありません。
valid.email.required=メールアドレスをご入力ください。
valid.email.format=メールアドレスの形式が正しくありません。
valid.privacy.required=個人情報の取り扱いにご同意ください。
valid.content.required=内容をご入力ください。

# ===== ファイルアップロード =====
error.file.too.large=ファイルサイズが大きすぎます。{0}MB以下でアップロードしてください。
error.file.unsupported=対応していないファイル形式です。JPG、PNG画像をアップロードしてください。
error.post.duplicate.slug=すでに使用されているURL(slug)です。
error.product.not.bookable=オンライン予約の対象外のプランです。お問い合わせよりお申し込みください。
error.booking.invalid.option=選択されたオプションが正しくありません。

# ===== 予約変更 =====
error.booking.reschedule.not.allowed=完了済み、またはキャンセルされたご予約は日時を変更できません。
error.booking.same.slot=現在ご予約の日時と同じです。別の日時をお選びください。
mail.booking.rescheduled.subject=[MONSTER HOUSE] 撮影予約の日時が変更されました
mail.booking.rescheduled.body=ご予約の日時が下記のとおり変更されました。確認のうえ、確定のご連絡をいたします。
# 管理者向けLINEは常に韓国語ですが、既存の line.* キーに合わせて用意しておきます。
line.booking.rescheduled=[予約変更] {0}\n{1} → {2}\n{3} / {4}

error.auth.duplicate.username=すでに使用されているIDです。
error.auth.same.password=現在のパスワードとは異なるパスワードをご入力ください。
error.auth.cannot.disable.self=ご自身のアカウントは無効化できません。

# ===== バナー =====
error.banner.not.found=バナーが見つかりません。
error.file.video.too.large=動画のサイズが大きすぎます。{0}MB以下でアップロードしてください。
error.file.video.unsupported=MP4動画のみアップロードできます。（.movはMP4に変換してください）
